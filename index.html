<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1430;
        font-family: system-ui, sans-serif;
        color: #f5f1e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-size: 15px;
      }
      #hud .top,
      #hud .bottom {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 16px 22px;
      }
      #hud .top {
        top: 0;
      }
      #hud .bottom {
        bottom: 0;
      }
      #hud .clock {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      #hud .blink {
        animation: blink 0.6s steps(2, start) infinite;
      }
      @keyframes blink {
        to {
          opacity: 0.25;
        }
      }
      #hud .motes {
        letter-spacing: 3px;
        color: #ffe58a;
      }
      #hud .cooldowns {
        color: #8fa3b8;
      }
      #hud .prompt,
      #hud .arrow {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(14, 20, 48, 0.7);
      }
      #hud .prompt {
        bottom: 70px;
        color: #f2c14e;
      }
      #hud .arrow {
        top: 90px;
        color: #8fa3b8;
      }
      #hint {
        position: fixed;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        opacity: 0.6;
        pointer-events: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(14, 20, 48, 0.82);
        backdrop-filter: blur(3px);
      }
      .panel {
        min-width: 340px;
        max-width: 640px;
        padding: 28px 36px;
        border: 1px solid rgba(242, 193, 78, 0.4);
        border-radius: 14px;
        background: #0e1430;
        text-align: center;
      }
      .panel h1 {
        margin-top: 0;
        color: #ffb347;
      }
      .panel .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 18px 0;
      }
      .panel button {
        margin: 6px;
        padding: 10px 16px;
        border: 1px solid #f2c14e;
        border-radius: 8px;
        background: transparent;
        color: #f5f1e6;
        cursor: pointer;
        font-size: 14px;
      }
      .panel button:hover {
        background: #f2c14e;
        color: #0e1430;
      }
      .panel label {
        display: block;
        margin: 14px 0;
      }
      .panel .small {
        margin-top: 20px;
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="hint"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
