<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đảo Đèn Lồng</title>
    <style>
      :root {
        --ui-scale: 1;
      }
      html {
        font-size: calc(16px * var(--ui-scale));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1430;
        font-family: system-ui, sans-serif;
        font-size: 1.125rem; /* 18 px at 1280×720 */
        color: #f5f1e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-size: 1.125rem;
      }
      #hud .top,
      #hud .bottom {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        padding: 16px 22px;
      }
      #hud .top {
        top: 0;
      }
      #hud .bottom {
        bottom: 0;
      }
      #hud .clock {
        font-size: 1.875rem;
        font-weight: 700;
        letter-spacing: 2px;
      }
      #hud .blink {
        animation: blink 0.6s steps(2, start) infinite;
      }
      body.no-motion #hud .blink {
        animation: none;
      }
      #hud .subtitle {
        position: absolute;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 8px;
        background: rgba(14, 20, 48, 0.82);
        font-weight: 700;
      }
      #hud .edge-arrow {
        position: absolute;
        font-size: 1.5rem;
        font-weight: 700;
      }
      @keyframes blink {
        to {
          opacity: 0.25;
        }
      }
      #hud .motes {
        letter-spacing: 3px;
        color: #ffe58a;
      }
      #hud .cooldowns {
        color: #8fa3b8;
      }
      #hud .prompt,
      #hud .arrow {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(14, 20, 48, 0.7);
      }
      #hud .prompt {
        bottom: 70px;
        color: #f2c14e;
      }
      #hud .arrow {
        top: 90px;
        color: #8fa3b8;
      }
      #hint {
        position: fixed;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.125rem;
        opacity: 0.75;
        pointer-events: none;
        text-align: center;
      }
      #flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: #ff5a5f;
        opacity: 0;
        transition: opacity 90ms linear;
      }
      #flash.on {
        opacity: 0.22;
      }
      body.no-motion #flash {
        display: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(14, 20, 48, 0.82);
        backdrop-filter: blur(3px);
      }
      .panel {
        min-width: 340px;
        max-width: 640px;
        max-height: 92vh;
        overflow-y: auto;
        padding: 28px 36px;
        border: 1px solid rgba(242, 193, 78, 0.4);
        border-radius: 14px;
        background: #0e1430;
        text-align: center;
      }
      .panel h1 {
        margin-top: 0;
        color: #ffb347;
      }
      .panel .row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 18px 0;
      }
      .panel.wide {
        max-width: 760px;
      }
      .panel button {
        margin: 6px;
        padding: 10px 16px;
        border: 1px solid #f2c14e;
        border-radius: 8px;
        background: transparent;
        color: #f5f1e6;
        cursor: pointer;
        font-size: 1.125rem;
      }
      .panel select,
      .panel input[type='text'],
      .panel input:not([type]) {
        font-size: 1.125rem;
        padding: 4px 8px;
        color: #f5f1e6;
        background: #1b2350;
        border: 1px solid #f2c14e;
        border-radius: 6px;
      }
      .keygrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px 12px;
        text-align: left;
      }
      .keyline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 4px 0;
      }
      .error {
        color: #ffffff;
        min-height: 1.2em;
      }
      .board {
        text-align: left;
        line-height: 1.6;
      }
      .score-form {
        margin: 16px 0;
        padding: 12px;
        border: 1px solid rgba(242, 193, 78, 0.4);
        border-radius: 8px;
      }
      .panel button:hover {
        background: #f2c14e;
        color: #0e1430;
      }
      .panel label {
        display: block;
        margin: 14px 0;
      }
      .panel .small {
        margin-top: 20px;
        font-size: 1.125rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="hint"></div>
    <div id="flash"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
